<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ここで寝たらただのサラリーマン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="touchControls">
      <button id="btnPause" type="button">II</button>
    </div>
  </div>
  <!-- プレイ画面（キャンバス）の外に置く、移動専用のジョイスティック -->
  <div id="moveJoystick">
    <div id="moveJoystickKnob"></div>
  </div>
  <!-- プレイ画面（キャンバス）の外に置く、押している間連射する攻撃ボタン -->
  <button id="btnMobileFire" type="button">連射</button>
  <!-- 連射ボタンの上に置く、パリィ（同僚弾のはじき返し）ボタン -->
  <button id="btnMobileParry" type="button">パリィ</button>
  <div id="rotateOverlay">
    <p>スマートフォンを横向きにしてください</p>
  </div>
  <script src="adventureScenes.js"></script>
  <script src="main.js"></script>
</body>
</html>
