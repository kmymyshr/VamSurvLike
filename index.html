<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ここで寝たらただのサラリーマン</title>
  <link rel="stylesheet" href="style.css">
  <!-- タイトル画面の背景（通常時／ノーマルエンド経験後のどちらか一方が必ず使われる）を、
       スクリプトの解析・実行を待たずに先読みしておく。読み込み遅延で背景だけ後から表示される現象を軽減する -->
  <link rel="preload" as="image" href="images/background/start_01.png">
  <link rel="preload" as="image" href="images/background/after_normalEND.png">
</head>
<body>
  <div id="gameWrapper">
    <div id="stage">
      <!-- 戦闘画面の左側に広げた帯。移動用ジョイスティックを配置する -->
      <div id="leftControlPanel">
        <button id="btnAutoFire" type="button">自動連射<br>OFF</button>
        <div id="moveJoystick">
          <div id="moveJoystickKnob"></div>
        </div>
      </div>
      <div id="canvasArea">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
      </div>
      <!-- 戦闘画面の右側に広げた帯。パリィ・連射ボタンと、その帯の上端に一時停止ボタンを配置する -->
      <div id="rightControlPanel">
        <button id="btnPause" type="button">II</button>
        <button id="btnMobileParry" type="button">パリィ</button>
        <button id="btnMobileFire" type="button">連射</button>
      </div>
    </div>
  </div>
  <div id="rotateOverlay">
    <p>スマートフォンを横向きにしてください</p>
  </div>
  <script src="adventureScenes.js"></script>
  <script src="main.js"></script>
</body>
</html>
