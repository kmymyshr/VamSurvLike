<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ここで寝たらただのサラリーマン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameWrapper">
    <div id="stage">
      <!-- 戦闘画面の左側に広げた帯。移動用ジョイスティックを配置する -->
      <div id="leftControlPanel">
        <div id="moveJoystick">
          <div id="moveJoystickKnob"></div>
        </div>
      </div>
      <div id="canvasArea">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="touchControls">
          <button id="btnPause" type="button">II</button>
        </div>
      </div>
      <!-- 戦闘画面の右側に広げた帯。パリィ・連射ボタンを配置する -->
      <div id="rightControlPanel">
        <button id="btnMobileParry" type="button">パリィ</button>
        <button id="btnMobileFire" type="button">連射</button>
      </div>
    </div>
  </div>
  <div id="rotateOverlay">
    <p>スマートフォンを横向きにしてください</p>
  </div>
  <script src="adventureScenes.js"></script>
  <script src="main.js"></script>
</body>
</html>
