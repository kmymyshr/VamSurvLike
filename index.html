<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ここで寝たらただのサラリーマン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="touchControls">
      <button id="btnAutoFire" type="button">自動/手動</button>
      <button id="btnPause" type="button">II</button>
    </div>
  </div>
  <!-- プレイ画面（キャンバス）の外に置く、移動専用のバーチャルスティック -->
  <div id="moveJoystick">
    <div id="moveJoystickKnob"></div>
  </div>
  <!-- プレイ画面（キャンバス）の外に置く、照準・攻撃専用のバーチャルスティック -->
  <div id="aimJoystick">
    <div id="aimJoystickKnob"></div>
  </div>
  <div id="rotateOverlay">
    <p>スマートフォンを横向きにしてください</p>
  </div>
  <script src="main.js"></script>
</body>
</html>
